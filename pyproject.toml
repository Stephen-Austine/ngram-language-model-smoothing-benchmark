[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngram-language-model-smoothing-benchmark"
version = "1.0.0"
description = "A from-scratch benchmark of n-gram language models (n=1-4) with Laplace, Good-Turing and Kneser-Ney smoothing, evaluated by perplexity and k-fold cross-validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stephen Austine" }]
keywords = ["nlp", "language-model", "n-gram", "smoothing", "kneser-ney", "good-turing", "perplexity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Education",
]
dependencies = [
    "nltk>=3.8",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0"]

[project.scripts]
ngram-experiments = "ngram_smoothing.experiments:main"

[tool.setuptools]
packages = ["ngram_smoothing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
